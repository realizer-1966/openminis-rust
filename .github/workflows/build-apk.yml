name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  RUST_VERSION: "1.83.0"
  NDK_VERSION: "27.2.12479018"
  SDK_VERSION: "35"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - name: Pin zeroize and idna_adapter for Rust 1.83
        run: |
          cargo generate-lockfile
          cargo update -p zeroize --precise 1.8.1 || true
          cargo update -p idna_adapter --precise 1.1.0 || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: |
            platforms;android-${{ env.SDK_VERSION }}
            platform-tools
            build-tools;35.0.0
            ndk;${{ env.NDK_VERSION }}
            cmake;3.22.1

      - name: Set NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Build Rust core for Android (aarch64)
        run: |
          cargo build --release -p minis-core --target aarch64-linux-android
        env:
          TMPDIR: /tmp
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang

      - name: Copy Rust .so to jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libminis_core.so android/app/src/main/jniLibs/arm64-v8a/ || echo "core .so not found — will build without native"

      - name: Copy frontend to assets
        run: cp frontend/index.html android/app/src/main/assets/index.html

      - name: Copy Kotlin bridge files
        run: |
          cp jni/src/main/kotlin/com/openminis/app/OffloadService.kt android/app/src/main/java/com/openminis/app/ 2>/dev/null || true
          cp jni/src/main/kotlin/com/openminis/app/MinisAccessibilityService.kt android/app/src/main/java/com/openminis/app/ 2>/dev/null || true
          cp jni/src/main/kotlin/com/openminis/app/MinisNotificationListenerService.kt android/app/src/main/java/com/openminis/app/ 2>/dev/null || true
          cp jni/src/main/kotlin/com/openminis/app/ShizukuBridge.kt android/app/src/main/java/com/openminis/app/ 2>/dev/null || true
          cp jni/src/main/kotlin/com/openminis/app/MediaPlayerManager.kt android/app/src/main/java/com/openminis/app/ 2>/dev/null || true
          cp jni/src/main/kotlin/com/openminis/app/SpeechRecognizerWrapper.kt android/app/src/main/java/com/openminis/app/ 2>/dev/null || true

      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openminis-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true