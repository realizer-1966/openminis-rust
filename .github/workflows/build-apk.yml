name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  releases: write

env:
  RUST_VERSION: "1.83.0"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type: [debug, release]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - name: Pin dependencies for Rust 1.83
        run: |
          cargo generate-lockfile
          cargo update -p zeroize --precise 1.8.1 || true
          cargo update -p idna_adapter --precise 1.1.0 || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "platform-tools" "build-tools;35.0.0" 2>&1 || true
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/*/ 2>/dev/null | head -1)
          if [ -z "$NDK_DIR" ]; then
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" 2>&1 || true
            NDK_DIR=$(ls -d $ANDROID_HOME/ndk/*/ 2>/dev/null | head -1)
          fi
          echo "ANDROID_NDK_HOME=${NDK_DIR%/}" >> $GITHUB_ENV

      - name: Build Rust core for Android
        run: |
          if [ "${{ matrix.build-type }}" = "release" ]; then
            cargo build --release -p minis-core --target aarch64-linux-android 2>&1 || echo "Rust release build failed"
          else
            cargo build -p minis-core --target aarch64-linux-android 2>&1 || echo "Rust debug build failed"
          fi
        env:
          TMPDIR: /tmp

      - name: Copy .so to jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          if [ "${{ matrix.build-type }}" = "release" ]; then
            cp target/aarch64-linux-android/release/libminis_core.so android/app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || echo "No .so (release)"
          else
            cp target/aarch64-linux-android/debug/libminis_core.so android/app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || echo "No .so (debug)"
          fi

      - name: Copy frontend to assets
        run: cp frontend/index.html android/app/src/main/assets/index.html

      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Build APK
        working-directory: android
        run: |
          if [ "${{ matrix.build-type }}" = "release" ]; then
            ./gradlew :app:assembleRelease --no-daemon
          else
            ./gradlew :app:assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openminis-${{ matrix.build-type }}-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true