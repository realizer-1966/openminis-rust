name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  RUST_VERSION: "1.83.0"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - name: Pin dependencies for Rust 1.83
        run: |
          cargo generate-lockfile
          cargo update -p zeroize --precise 1.8.1 || true
          cargo update -p idna_adapter --precise 1.1.0 || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (manual)
        run: |
          # GitHub Actions 러너에는 Android SDK가 이미 설치되어 있음
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          # NDK 설치 — 러너에 이미 NDK가 있을 수 있음
          ls $ANDROID_HOME/ndk/ 2>/dev/null || true
          # cmdline-tools로 패키지 설치
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "platform-tools" "build-tools;35.0.0" 2>&1 || true
          # NDK — 러너에 있는 것 사용 또는 설치
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/*/ 2>/dev/null | head -1)
          if [ -z "$NDK_DIR" ]; then
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" 2>&1 || true
            NDK_DIR=$(ls -d $ANDROID_HOME/ndk/*/ 2>/dev/null | head -1)
          fi
          echo "ANDROID_NDK_HOME=${NDK_DIR%/}" >> $GITHUB_ENV
          echo "NDK path: ${NDK_DIR%/}"

      - name: Build Rust core for Android (aarch64)
        run: |
          cargo build --release -p minis-core --target aarch64-linux-android 2>&1 || echo "Rust Android build failed — continuing without .so"
        env:
          TMPDIR: /tmp

      - name: Copy Rust .so to jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libminis_core.so android/app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || echo "No .so — building APK without native lib"

      - name: Copy frontend to assets
        run: cp frontend/index.html android/app/src/main/assets/index.html

      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openminis-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true