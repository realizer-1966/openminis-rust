<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OpenMinis</title>
    <style>
        :root {
            --teal-primary: #2E8B8B;
            --teal-dark: #4DD9D9;
            --bg: #F5FAFA;
            --surface: #FFFFFF;
            --text: #171D1C;
            --text-secondary: #6F7977;
            --outline: #D1D1D6;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0E1514;
                --surface: #1C1C1E;
                --text: #DEE4E2;
                --text-secondary: #899390;
                --outline: #38383A;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }
        .app {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 240px;
            background: var(--surface);
            border-right: 1px solid var(--outline);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }
        .new-chat-btn {
            padding: 10px 16px;
            background: var(--teal-primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .session-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
        .session-item {
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text);
        }
        .session-item:hover { background: var(--bg); }
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .message-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: var(--teal-primary);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            align-self: flex-start;
            background: var(--surface);
            border-bottom-left-radius: 4px;
        }
        .input-bar {
            padding: 12px 16px;
            background: var(--surface);
            border-top: 1px solid var(--outline);
            display: flex;
            gap: 8px;
        }
        .message-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--outline);
            border-radius: 12px;
            font-size: 15px;
            background: var(--bg);
            color: var(--text);
            outline: none;
        }
        .send-btn {
            padding: 10px 20px;
            background: var(--teal-primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="./pkg/minis_frontend.js"></script>
</body>
</html>
